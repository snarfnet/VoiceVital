name: Build & Upload

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  KEY_ID: WDXGY9WX55
  ISSUER_ID: 2be0734f-943a-4d61-9dc9-5d9045c46fec

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          XCODE_APP=$(ls /Applications/ | grep -E "^Xcode_2[6-9]|^Xcode_[3-9][0-9]" | sort -V | tail -1)
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "/Applications/$XCODE_APP"
          else
            XCODE_APP=$(ls /Applications/ | grep "^Xcode_" | sort -V | tail -1)
            sudo xcode-select -s "/Applications/$XCODE_APP"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Set up ASC API Key
        env:
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_API_KEY_CONTENT" | base64 -D > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

      - name: Clean up old certificates
        continue-on-error: true
        run: |
          pip3 install "pyjwt[crypto]" requests --break-system-packages
          python3 - <<'PYEOF'
          import jwt, time, requests, os
          KEY_ID = os.environ["KEY_ID"]
          ISSUER = os.environ["ISSUER_ID"]
          key_path = os.path.expanduser(f"~/.appstoreconnect/private_keys/AuthKey_{KEY_ID}.p8")
          with open(key_path) as f: key = f.read()
          token = jwt.encode({"iss": ISSUER, "iat": int(time.time()), "exp": int(time.time())+600, "aud": "appstoreconnect-v1"}, key, algorithm="ES256", headers={"kid": KEY_ID})
          h = {"Authorization": f"Bearer {token}"}
          r = requests.get("https://api.appstoreconnect.apple.com/v1/certificates?filter[certificateType]=DEVELOPMENT&limit=200", headers=h)
          certs = r.json().get("data", [])
          print(f"Found {len(certs)} DEVELOPMENT certs")
          if len(certs) >= 8:
              certs.sort(key=lambda c: c["attributes"].get("expirationDate",""))
              for c in certs[:len(certs)-2]:
                  dr = requests.delete(f"https://api.appstoreconnect.apple.com/v1/certificates/{c['id']}", headers=h)
                  print(f"  Delete {c['id']}: {dr.status_code}")
          PYEOF

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project VoiceVital.xcodeproj \
            -scheme VoiceVital

      - name: Archive
        run: |
          xcodebuild archive \
            -project VoiceVital.xcodeproj \
            -scheme VoiceVital \
            -destination 'generic/platform=iOS' \
            -archivePath build/VoiceVital.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyIssuerID $ISSUER_ID \
            -authenticationKeyID $KEY_ID \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=83VGKGSQUH

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/VoiceVital.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist export_options.plist \
            -allowProvisioningUpdates \
            -authenticationKeyIssuerID $ISSUER_ID \
            -authenticationKeyID $KEY_ID \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

      - name: Upload to App Store Connect
        run: |
          xcrun altool --upload-app \
            -f build/export/VoiceVital.ipa \
            -t ios \
            --apiKey $KEY_ID \
            --apiIssuer $ISSUER_ID
